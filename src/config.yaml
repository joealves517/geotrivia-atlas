site:
  name: GeoTrivia Atlas
  site: 'https://atlas.geotriviax.com'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: GeoTrivia Atlas — World Enigma & Exploration
    template: '%s — GeoTrivia Atlas'
  description: "Explore mind-bending geographical wonders, climate paradoxes, strange borders, and Earth's greatest natural phenomena."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: GeoTrivia Atlas
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@geotriviax'
    site: '@geotriviax'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'atlas' # Atlas main path (/atlas)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'atlas' # Category path /atlas/some-category
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
